<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen relative">
        <!-- Contenedor de mensajes -->
        {% if messages %}
        <div class="space-y-4 absolute ">
            {% for message in messages %}
                <div class="relative p-4 rounded-lg shadow-md text-white
                            {% if message.tags == 'success' %} bg-green-500
                            {% elif message.tags == 'error' %} bg-red-500
                            {% elif message.tags == 'warning' %} bg-yellow-500
                            {% elif message.tags == 'info' %} bg-blue-500
                            {% else %} bg-gray-500 {% endif %}">
                    <p>{{ message }}</p>
                    <!-- Botón para cerrar el mensaje -->
                    <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 p-1 rounded-full hover:bg-black/10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-amber-800">Iniciar Sesión</h2>
        <form method="POST">
            {% csrf_token %}
            <!-- Campo de correo electrónico con icono -->
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-amber-700">Correo Electrónico</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <!-- Icono de correo electrónico -->
                        <svg class="h-5 w-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
                        </svg>
                    </div>
                    <input type="email" id="email" name="email" class="focus:ring-amber-500 focus:border-amber-500 block w-full pl-10 pr-4 py-2 border border-amber-300 rounded-md" placeholder="Ingresa tu correo electrónico" required>
                </div>
            </div>

            <!-- Campo de contraseña con icono -->
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-amber-700">Contraseña</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <!-- Icono de contraseña -->
                        <svg class="h-5 w-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <input type="password" id="password" name="password" class="focus:ring-amber-500 focus:border-amber-500 block w-full pl-10 pr-4 py-2 border border-amber-300 rounded-md" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>

            <!-- Botón de envío -->
            <button type="submit" class="w-full bg-amber-600 text-white py-2 px-4 rounded-md hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-opacity-50">
                Iniciar Sesión
            </button>

            <!-- Enlace para recuperar contraseña -->
            {% comment %} <div class="mt-4 text-center">
                <a href="#" class="text-sm text-amber-600 hover:text-amber-500">¿Olvidaste tu contraseña?</a>
            </div> {% endcomment %}

            <!-- Enlace para registrarse -->
            <div class="mt-6 text-center">
                <p class="text-sm text-amber-600">¿No tienes una cuenta? <a href="{% url 'registro' %}" class="text-amber-600 hover:text-amber-500">Regístrate</a></p>
            </div>
        </form>
    </div>
</body>
</html>
