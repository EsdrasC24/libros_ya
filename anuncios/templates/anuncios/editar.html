{% extends 'anuncios/base.html' %}

{% block title %}Editar Anuncio{% endblock %}

{% block content %}

<h1 class="text-2xl font-bold mb-6">Editar Anuncio</h1>
<form method="post" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
    {% csrf_token %}
    <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="id_titulo">Título</label>
        {{ form.titulo }}
    </div>
    <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="id_edicion">Edición</label>
        {{ form.edicion }}
    </div>
    <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="id_estado">Estado</label>
        {{ form.estado }}
    </div>
    <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="id_precio">Precio</label>
        {{ form.precio }}
    </div>
    <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="id_condiciones_intercambio">Condiciones de Intercambio</label>
        {{ form.condiciones_intercambio }}
    </div>
    <div class="flex items-center justify-between">
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Guardar Cambios
        </button>
        <a href="{% url 'detalle_anuncio' anuncio.id %}" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
            Cancelar
        </a>
    </div>
</form>

{% endblock %}
